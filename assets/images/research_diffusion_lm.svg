<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none">
  <title>Diffusion language generation from alternative noisy initial states</title>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1L5 3.5L1 6" stroke="#2F6DB5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g stroke="#2F6DB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- These are alternative initial states, rather than simultaneous inputs. -->
    <rect x="12" y="35" width="64" height="52" rx="7" fill="#E6EFFA" stroke-dasharray="3 4"/>
    <rect x="88" y="35" width="64" height="52" rx="7" fill="#E6EFFA" stroke-dasharray="3 4"/>
    <rect x="164" y="35" width="64" height="52" rx="7" fill="#E6EFFA" stroke-dasharray="3 4"/>
    <g stroke-opacity=".6"><path d="M22 47L27 51M55 46L60 43M33 67L38 62M63 73L59 77M24 77L28 73M48 55L53 59"/></g>
    <g fill="#2F6DB5" stroke="none">
      <circle cx="38" cy="46" r="1.8"/><circle cx="22" cy="61" r="1.5"/><circle cx="65" cy="60" r="2"/>
      <circle cx="44" cy="77" r="1.6"/><circle cx="47" cy="66" r="2"/><circle cx="35" cy="55" r="1.3"/>
    </g>
    <path d="M44 108V116Q44 122 52 122H188Q196 122 196 116V108" stroke-opacity=".65"/>
    <path d="M120 108V132" marker-end="url(#arrow)"/>
    <rect x="39" y="139" width="162" height="35" rx="9" fill="#FFF"/>
    <path d="M177 151A7 7 0 1 1 174 161M177 151V155H173"/>
    <path d="M120 179V187" marker-end="url(#arrow)"/>
    <rect x="21" y="194" width="198" height="31" rx="7" fill="#FFF"/>
  </g>
  <g fill="#1F4E8C" text-anchor="middle">
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="120" y="20" font-size="10.5">Alternative initial states</text>
      <text x="44" y="101" font-size="9">Gaussian noise</text>
      <text x="120" y="101" font-size="9">Mask tokens</text>
      <text x="196" y="101" font-size="9">Random tokens</text>
      <text x="107" y="161" font-size="11">Iterative denoising</text>
      <text x="120" y="238" font-size="10">Generated text</text>
    </g>
    <g font-family="monospace" font-size="10">
      <text x="120" y="55">[MASK]</text><text x="120" y="73">[MASK]</text>
      <text x="196" y="55">blue 7</text><text x="196" y="73">on the</text>
      <text x="120" y="214">The model generates text.</text>
    </g>
  </g>
</svg>
